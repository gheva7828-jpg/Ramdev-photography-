<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAM DEV PHOTOGRAPHY</title>
<style>
body{font-family:Arial;background:#f2f4f7;padding:18px;margin:0}
.box{max-width:600px;margin:auto;background:white;padding:20px;border-radius:15px}
h2{text-align:center}
button{width:100%;padding:15px;margin:10px 0;border:0;border-radius:9px;font-size:17px;font-weight:bold}
#choose{background:#1267d6;color:white}
#gallery{background:#e4e7eb}
#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
#bar{height:12px;background:#159447;width:0%}
.track{background:#ddd;border-radius:10px;overflow:hidden}
</style>
</head>
<body>
<div class="box">
<h2>RAM DEV PHOTOGRAPHY</h2>
<p>एक साथ कई फोटो चुनें। हर फोटो पर वॉटरमार्क अपने-आप लगेगा।</p>

<input id="files" type="file" accept="image/*" multiple hidden>

<button id="choose">📷 कई फोटो चुनें और अपलोड करें</button>

<div class="track"><div id="bar"></div></div>
<p id="status">फोटो चुनें।</p>

<button id="gallery">गैलरी खोलें</button>
</div>

<script>
const URL_BASE="https://wxrwkvlcatryuopvwqjh.supabase.co";
const KEY="sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";
const BUCKET="Wedding photo";

const input=document.getElementById("files");
const choose=document.getElementById("choose");
const status=document.getElementById("status");
const bar=document.getElementById("bar");

choose.onclick=()=>input.click();

document.getElementById("gallery").onclick=()=>{
 location.href="./index.html";
};

function makePhoto(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  const objectURL=URL.createObjectURL(file);

  img.onload=()=>{
   try{
    const scale=Math.min(1,2600/Math.max(img.width,img.height));
    const w=Math.round(img.width*scale);
    const h=Math.round(img.height*scale);
    const canvas=document.createElement("canvas");
    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    const size=Math.max(24,Math.round(w*0.035));
    const margin=Math.max(18,Math.round(w*0.025));

    ctx.font="bold "+size+"px Arial";
    ctx.textAlign="right";
    ctx.textBaseline="top";
    ctx.fillStyle="white";
    ctx.shadowColor="black";
    ctx.shadowBlur=4;
    ctx.shadowOffsetX=1;
    ctx.shadowOffsetY=1;

    ctx.fillText(
     "RAM DEV PHOTOGRAPHY",
     w-margin,
     margin+Math.round(size*0.35),
     w-margin*2
    );

    canvas.toBlob(blob=>{
     URL.revokeObjectURL(objectURL);
     if(blob)resolve(blob);
     else reject(Error("फोटो तैयार नहीं हुई"));
    },"image/jpeg",0.88);

   }catch(e){
    URL.revokeObjectURL(objectURL);
    reject(e);
   }
  };

  img.onerror=()=>{
   URL.revokeObjectURL(objectURL);
   reject(Error("फोटो खुल नहीं पाई"));
  };

  img.src=objectURL;
 });
}

function uploadPhoto(blob,name){
 return new Promise((resolve,reject)=>{
  const path=encodeURIComponent(BUCKET)+"/"+encodeURIComponent(name);
  const xhr=new XMLHttpRequest();

  xhr.open("POST",URL_BASE+"/storage/v1/object/"+path);
  xhr.setRequestHeader("apikey",KEY);
  xhr.setRequestHeader("Authorization","Bearer "+KEY);
  xhr.setRequestHeader("Content-Type","image/jpeg");
  xhr.setRequestHeader("x-upsert","false");

  xhr.onload=()=>{
   if(xhr.status>=200 && xhr.status<300) resolve();
   else reject(Error("Upload error "+xhr.status+" "+xhr.responseText));
  };

  xhr.onerror=()=>reject(Error("इंटरनेट की समस्या"));
  xhr.send(blob);
 });
}

input.onchange=async()=>{
 const files=Array.from(input.files||[])
  .filter(f=>f.type.startsWith("image/"));

 if(!files.length){
  status.textContent="कोई फोटो नहीं चुनी गई।";
  return;
 }

 choose.disabled=true;
 let success=0;
 let failed=[];

 for(let i=0;i<files.length;i++){
  status.textContent=
   "कुल फोटो: "+files.length+
   "\nअपलोड हो रही है: "+(i+1)+"/"+files.length+
   "\nसफल: "+success;

  try{
   const blob=await makePhoto(files[i]);
   const name="ramdev_"+Date.now()+"_"+i+".jpg";
   await uploadPhoto(blob,name);
   success++;
  }catch(e){
   failed.push(files[i].name+" — "+e.message);
  }

  bar.style.width=((i+1)/files.length*100)+"%";
 }

 status.textContent=
  "अपलोड पूरा!\nसफल फोटो: "+success+
  "\nअसफल फोटो: "+failed.length+
  (failed.length?"\n\n"+failed.join("\n"):"");

 choose.disabled=false;
 input.value="";
};
</script>
</body>
</html>
