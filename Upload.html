<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramdev Photography - Upload</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:white;text-align:center;padding:18px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:14px;margin-top:15px}
button{background:#111;color:white;border:0;border-radius:10px;padding:12px 18px;margin-top:12px}
input{margin-top:12px;width:100%}
#status{margin-top:15px;padding:10px;background:#eee;border-radius:8px}
</style>
</head>

<body>

<header>
<h2>RAMDEV PHOTOGRAPHY</h2>
<div>Photo Upload</div>
</header>

<main>
<div class="card">
<h3>📷 Wedding Photos Upload</h3>

<input id="photos" type="file" accept="image/*" multiple>

<button onclick="uploadPhotos()">फोटो Upload करें</button>

<div id="status">फोटो चुनें और Upload करें।</div>
</div>
</main>

<script>
const SUPABASE_URL="https://wxrwkvlcatryuopvwqjh.supabase.co";
const BUCKET="Wedding photo";
const KEY="sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";

async function watermark(file){

 const img=await new Promise((resolve,reject)=>{
   const x=new Image();
   x.onload=()=>resolve(x);
   x.onerror=reject;
   x.src=URL.createObjectURL(file);
 });

 const max=2000;
 let w=img.width,h=img.height;

 if(w>max){h=Math.round(h*max/w);w=max}
 if(h>max){w=Math.round(w*max/h);h=max}

 const c=document.createElement("canvas");
 c.width=w;c.height=h;

 const ctx=c.getContext("2d");
 ctx.drawImage(img,0,0,w,h);

 /* सिर्फ ऊपर-दाएँ watermark */
 ctx.fillStyle="rgba(255,255,255,.65)";
 ctx.font="bold 22px Arial";
 ctx.textAlign="right";
 ctx.fillText("RAMDEV PHOTOGRAPHY",w-20,35);

 return new Promise(resolve=>{
   c.toBlob(resolve,"image/jpeg",.88);
 });
}

async function uploadPhotos(){

 const files=[...document.getElementById("photos").files];

 if(!files.length){
   document.getElementById("status").textContent="पहले फोटो चुनें।";
   return;
 }

 let done=0;

 for(const file of files){

   document.getElementById("status").textContent=
   "Photo "+(done+1)+" / "+files.length+" तैयार हो रही है...";

   try{

     const blob=await watermark(file);

     const name=
       Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+ 
       file.name.replace(/\.[^/.]+$/,"").replace(/[^\w\-]+/g,"_")+
       ".jpg";

     const url=
       SUPABASE_URL+
       "/storage/v1/object/"+
       encodeURIComponent(BUCKET)+"/"+
       encodeURIComponent(name);

     const r=await fetch(url,{
       method:"POST",
       headers:{
         "apikey":KEY,
         "Authorization":"Bearer "+KEY,
         "Content-Type":"image/jpeg",
         "x-upsert":"false"
       },
       body:blob
     });

     if(!r.ok) throw new Error(await r.text());

     done++;

   }catch(e){
     console.error(e);
   }
 }

 document.getElementById("status").textContent=
 "✅ "+done+" फोटो successfully upload हो गई।";

 document.getElementById("photos").value="";
}
</script>

</body>
</html>
