
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramdev Photography Upload</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#222;color:#fff}
header{background:#111;text-align:center;padding:22px 10px}
header h2{margin:0 0 8px;font-size:21px}
header div{font-size:14px}
main{padding:20px;max-width:650px;margin:auto}
.card{background:#111;padding:25px;border-radius:15px;text-align:center}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;font-size:17px;font-weight:bold}
#choose{background:white;color:#111}
#galleryBtn{background:#333;color:white}
#status{margin-top:18px;padding:13px;border-radius:10px;background:#292929;line-height:1.5;overflow-wrap:anywhere}
input{display:none}
</style>
</head>
<body>
<header>
<h2>RAMDEV PHOTOGRAPHY</h2>
<div>Wedding Photo Upload</div>
</header>
<main>
<div class="card">
<button id="choose">📷 फोटो अपलोड करें</button>
<input id="file" type="file" accept="image/*">
<div id="status">फोटो चुनने के लिए बटन दबाएँ।</div>
<button id="galleryBtn">🖼️ Gallery खोलें</button>
</div>
</main>
<script>
const SUPABASE_URL="https://wxrwkvlcatryuopvwqjh.supabase.co";
const BUCKET="Wedding photo";
const KEY="sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";
const fileInput=document.getElementById("file");
const statusBox=document.getElementById("status");
const chooseBtn=document.getElementById("choose");

chooseBtn.onclick=()=>fileInput.click();

document.getElementById("galleryBtn").onclick=()=>{
  location.href="./index.html";
};

fileInput.onchange=async()=>{
  const file=fileInput.files[0];
  if(!file)return;

  try{
    chooseBtn.disabled=true;
    statusBox.textContent="⏳ फोटो तैयार हो रही है...";

    const image=new Image();
    const imageURL=URL.createObjectURL(file);

    await new Promise((resolve,reject)=>{
      image.onload=resolve;
      image.onerror=reject;
      image.src=imageURL;
    });

    const canvas=document.createElement("canvas");
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(image,0,0);

    const fontSize=Math.max(28,Math.round(canvas.width*0.035));
    const margin=Math.max(20,Math.round(canvas.width*0.025));

    ctx.font="bold "+fontSize+"px Arial";
    ctx.textAlign="right";
    ctx.textBaseline="top";
    ctx.fillStyle="rgba(255,255,255,0.85)";
    ctx.shadowColor="rgba(0,0,0,0.5)";
    ctx.shadowBlur=3;

    // वॉटरमार्क: पहले से थोड़ा नीचे
    ctx.fillText("RAMDEV PHOTOGRAPHY",
      canvas.width-margin,
      fontSize+Math.round(canvas.height*0.035)
    );

    URL.revokeObjectURL(imageURL);

    const blob=await new Promise(resolve=>
      canvas.toBlob(resolve,"image/jpeg",0.92)
    );
    if(!blob)throw new Error("फोटो तैयार नहीं हुई।");

    statusBox.textContent="⏳ फोटो अपलोड हो रही है...";

    const safeName="wedding_"+Date.now()+".jpg";
    const uploadURL=SUPABASE_URL+
      "/storage/v1/object/"+
      encodeURIComponent(BUCKET)+"/"+
      encodeURIComponent(safeName);

    const response=await fetch(uploadURL,{
      method:"POST",
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY,
        "Content-Type":"image/jpeg",
        "x-upsert":"false"
      },
      body:blob
    });

    if(!response.ok){
      const details=await response.text();
      throw new Error("Upload error "+response.status+": "+details);
    }

    statusBox.textContent="✅ फोटो Gallery में लग गई।";
    chooseBtn.textContent="📷 अगली फोटो अपलोड करें";
    fileInput.value="";
  }catch(error){
    statusBox.textContent="❌ "+error.message;
  }finally{
    chooseBtn.disabled=false;
  }
};
</script>
</body>
</html>
