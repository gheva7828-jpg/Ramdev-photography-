<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ramdev Photography - Upload</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:18px;
}

main{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-top:15px;
  box-shadow:0 2px 8px #ddd;
}

input{
  width:100%;
  margin-top:15px;
  font-size:16px;
}

button{
  width:100%;
  background:#111;
  color:white;
  border:0;
  border-radius:10px;
  padding:14px;
  margin-top:18px;
  font-size:16px;
}

button:disabled{
  background:#777;
}

#status{
  margin-top:15px;
  padding:12px;
  background:#eee;
  border-radius:8px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
  <h2>RAMDEV PHOTOGRAPHY</h2>
  <div>Photo Upload</div>
</header>

<main>

<div class="card">

<h3>📷 Wedding Photos Upload</h3>

<input
  id="photos"
  type="file"
  accept="image/*"
  multiple
>

<button id="uploadBtn" type="button">
  फोटो Upload करें
</button>

<div id="status">
  पहले फोटो चुनें।
</div>

</div>

</main>

<script>

const SUPABASE_URL =
"https://wxrwkvlcatryuopvwqjh.supabase.co";

const BUCKET =
"Wedding photo";

const KEY =
"sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";


const input =
document.getElementById("photos");

const button =
document.getElementById("uploadBtn");

const status =
document.getElementById("status");


/* फोटो में ऊपर-दाएँ watermark लगाना */

async function watermark(file){

  const url = URL.createObjectURL(file);

  try{

    const img = await new Promise((resolve,reject)=>{

      const image = new Image();

      image.onload = () => resolve(image);

      image.onerror = () =>
        reject(new Error("फोटो खुल नहीं पाई।"));

      image.src = url;

    });


    const MAX = 1800;

    let w = img.naturalWidth;
    let h = img.naturalHeight;


    if(w > MAX){

      h = Math.round(h * MAX / w);
      w = MAX;

    }

    if(h > MAX){

      w = Math.round(w * MAX / h);
      h = MAX;

    }


    const canvas =
      document.createElement("canvas");

    canvas.width = w;
    canvas.height = h;


    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(img,0,0,w,h);


    /* केवल एक watermark */

    const fontSize =
      Math.max(18,Math.round(w/65));

    ctx.font =
      "bold " + fontSize + "px Arial";

    ctx.textAlign = "right";

    ctx.textBaseline = "top";

    ctx.fillStyle =
      "rgba(255,255,255,0.65)";

    ctx.shadowColor =
      "rgba(0,0,0,0.35)";

    ctx.shadowBlur = 3;

    ctx.fillText(
      "RAMDEV PHOTOGRAPHY",
      w - 20,
      15
    );


    const blob =
      await new Promise((resolve,reject)=>{

        canvas.toBlob(
          b => b
            ? resolve(b)
            : reject(
                new Error(
                  "फोटो तैयार नहीं हो पाई।"
                )
              ),
          "image/jpeg",
          0.88
        );

      });


    return blob;

  }finally{

    URL.revokeObjectURL(url);

  }

}


/* Upload */

async function uploadPhotos(){

  const files =
    Array.from(input.files || []);


  if(files.length === 0){

    status.textContent =
      "❌ पहले फोटो चुनें।";

    return;

  }


  button.disabled = true;


  let done = 0;

  let failed = 0;


  for(let i=0;i<files.length;i++){

    const file = files[i];


    status.textContent =
      "⏳ फोटो " +
      (i+1) +
      " / " +
      files.length +
      " तैयार हो रही है...";


    try{

      const blob =
        await watermark(file);


      const original =
        file.name
          .replace(/\.[^/.]+$/,"")
          .replace(/[^\w\-]+/g,"_");


      const filename =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,8) +
        "-" +
        original +
        ".jpg";


      const uploadURL =
        SUPABASE_URL +
        "/storage/v1/object/" +
        encodeURIComponent(BUCKET) +
        "/" +
        encodeURIComponent(filename);


      status.textContent =
        "⬆️ फोटो " +
        (i+1) +
        " / " +
        files.length +
        " upload हो रही है...";


      const response =
        await fetch(uploadURL,{

          method:"POST",

          headers:{

            "apikey":KEY,

            "Authorization":
              "Bearer " + KEY,

            "Content-Type":
              "image/jpeg",

            "x-upsert":
              "false"

          },

          body:blob

        });


      if(!response.ok){

        const errorText =
          await response.text();

        throw new Error(errorText);

      }


      done++;


    }catch(error){

      failed++;

      console.error(error);

      status.textContent =
        "❌ फोटो " +
        (i+1) +
        " upload नहीं हुई: " +
        error.message;

      await new Promise(
        resolve => setTimeout(resolve,1500)
      );

    }

  }


  if(failed === 0){

    status.innerHTML =
      "✅ <b>" +
      done +
      " फोटो successfully upload हो गई।</b><br><br>" +
      "अब Gallery खोलकर फोटो देख सकते हैं।";

  }else{

    status.innerHTML =
      "✅ " +
      done +
      " फोटो upload हुई।<br>" +
      "❌ " +
      failed +
      " फोटो में समस्या आई।";

  }


  input.value = "";

  button.disabled = false;

}


/* Button को सीधे JavaScript से चलाना */

button.addEventListener(
  "click",
  uploadPhotos
);

</script>

</body>
</html>
