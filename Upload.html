
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramdev Photography Upload</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#222;
  color:white;
}
header{
  background:#111;
  text-align:center;
  padding:22px 10px;
}
header h2{margin:0 0 8px;font-size:21px}
header div{font-size:14px}
main{padding:20px;max-width:650px;margin:auto}
.card{
  background:#111;
  padding:20px;
  border-radius:15px;
  text-align:center;
}
.uploadBtn{
  display:block;
  position:relative;
  width:100%;
  padding:17px 10px;
  margin:0 0 12px;
  border-radius:10px;
  background:white;
  color:#111;
  font-size:17px;
  font-weight:bold;
  overflow:hidden;
}
.uploadBtn input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0.01;
  cursor:pointer;
}
button{
  display:block;
  width:100%;
  padding:15px 10px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}
#galleryBtn{background:#333;color:white}
#status{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#292929;
  line-height:1.5;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>
<header>
  <h2>RAMDEV PHOTOGRAPHY</h2>
  <div>Wedding Photo Upload</div>
</header>

<main>
  <div class="card">
    <label class="uploadBtn">
      📷 फोटो अपलोड करें
      <input id="file" type="file" accept="image/*">
    </label>

    <div id="status">फोटो चुनने के लिए ऊपर बटन दबाएँ।</div>

    <button id="galleryBtn">🖼️ Gallery खोलें</button>
  </div>
</main>

<script>
const SUPABASE_URL="https://wxrwkvlcatryuopvwqjh.supabase.co";
const BUCKET="Wedding photo";
const KEY="sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";

const fileInput=document.getElementById("file");
const statusBox=document.getElementById("status");
const uploadBtn=document.querySelector(".uploadBtn");

document.getElementById("galleryBtn").onclick=()=>{
  window.location.href="./index.html";
};

fileInput.addEventListener("change",async()=>{
  const file=fileInput.files && fileInput.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    statusBox.textContent="❌ कृपया फोटो चुनें।";
    return;
  }

  uploadBtn.style.pointerEvents="none";
  statusBox.textContent="⏳ फोटो तैयार हो रही है...";

  let imageURL="";

  try{
    const image=new Image();
    imageURL=URL.createObjectURL(file);

    await new Promise((resolve,reject)=>{
      image.onload=resolve;
      image.onerror=()=>reject(new Error("फोटो खुल नहीं पाई।"));
      image.src=imageURL;
    });

    const canvas=document.createElement("canvas");
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;

    const ctx=canvas.getContext("2d");
    if(!ctx)throw new Error("फोटो तैयार नहीं हो पाई।");

    ctx.drawImage(image,0,0);

    const fontSize=Math.max(28,Math.round(canvas.width*0.035));
    const margin=Math.max(20,Math.round(canvas.width*0.025));

    ctx.font="bold "+fontSize+"px Arial";
    ctx.textAlign="right";
    ctx.textBaseline="top";
    ctx.fillStyle="rgba(255,255,255,0.85)";
    ctx.shadowColor="rgba(0,0,0,0.5)";
    ctx.shadowBlur=3;

    // वॉटरमार्क: वही साइज़, ऊपर से थोड़ा नीचे
    ctx.fillText(
      "RAMDEV PHOTOGRAPHY",
      canvas.width-margin,
      fontSize+Math.round(canvas.height*0.035)
    );

    URL.revokeObjectURL(imageURL);
    imageURL="";

    statusBox.textContent="⏳ फोटो अपलोड हो रही है...";

    const blob=await new Promise(resolve=>{
      canvas.toBlob(resolve,"image/jpeg",0.92);
    });

    if(!blob)throw new Error("फोटो तैयार नहीं हुई।");

    const filename="wedding_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+".jpg";

    const uploadURL=SUPABASE_URL+
      "/storage/v1/object/"+
      encodeURIComponent(BUCKET)+"/"+
      encodeURIComponent(filename);

    const response=await fetch(uploadURL,{
      method:"POST",
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY,
        "Content-Type":"image/jpeg",
        "x-upsert":"false"
      },
      body:blob
    });

    if(!response.ok){
      const detail=await response.text();
      throw new Error("Upload error "+response.status+": "+detail);
    }

    statusBox.textContent="✅ फोटो Gallery में अपलोड हो गई!";
    fileInput.value="";

  }catch(error){
    statusBox.textContent="❌ "+error.message;
  }finally{
    if(imageURL)URL.revokeObjectURL(imageURL);
    uploadBtn.style.pointerEvents="auto";
  }
});
</script>
</body>
</html>
