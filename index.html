<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramdev Photography</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:10px;padding:11px 15px;background:#111;color:white;margin:5px;cursor:pointer}
input{padding:11px;border:1px solid #ccc;border-radius:9px;width:100%;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{background:#eee;border-radius:10px;overflow:hidden}
.photo img{width:100%;display:block}
.small{color:#666;font-size:13px}
#gallery{margin-top:15px}
</style>
</head>
<body>
<header><h2>RAMDEV PHOTOGRAPHY</h2><div>Wedding Photo Gallery Demo</div></header>
<main>
<div class="card">
<h3>Wedding Gallery</h3>
<p class="small">Demo में कोई Wedding Code नहीं है। QR से आने वाला visitor इसी current gallery को देखेगा.</p>
<input id="files" type="file" accept="image/*" multiple>
<button onclick="addPhotos()">Photos Add करें</button>
<button onclick="clearGallery()">Current Gallery Delete करें</button>
<div id="gallery" class="grid"></div>
</div>
<div class="card">
<h3>Permanent QR</h3>
<p class="small">Final version में इसी एक QR को permanent रखा जाएगा। QR के पीछे आपकी current gallery का link रहेगा.</p>
<div id="qrText" style="padding:12px;background:#f0f0f0;border-radius:9px">Final hosted link यहाँ आएगा.</div>
</div>
</main>
<script>
const KEY="ramdev_demo_photos";
function get(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function render(){
 const g=document.getElementById("gallery"); g.innerHTML="";
 get().forEach((src,i)=>{
   const d=document.createElement("div"); d.className="photo";
   d.innerHTML=`<img src="${src}" alt="Wedding photo"><div style="padding:8px"><button onclick="downloadPhoto(${i})">Download</button></div>`;
   g.appendChild(d);
 });
}
async function addPhotos(){
 const fs=[...document.getElementById("files").files];
 if(!fs.length)return alert("पहले photos चुनें.");
 const arr=get();
 for(const f of fs){
   const b=await createWatermarked(f);
   arr.push(b);
 }
 save(arr); render();
}
function createWatermarked(file){
 return new Promise(resolve=>{
   const img=new Image(), r=new FileReader();
   r.onload=e=>{img.onload=()=>{
     const max=1800, scale=Math.min(1,max/Math.max(img.width,img.height));
     const c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
     const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
     x.font=Math.max(18,c.width*0.025)+"px Arial"; x.fillStyle="rgba(255,255,255,.75)";
     x.textAlign="right"; x.textBaseline="bottom"; x.fillText("RAMDEV PHOTOGRAPHY",c.width-20,c.height-20);
     resolve(c.toDataURL("image/jpeg",.88));
   }; img.src=e.target.result}; r.readAsDataURL(file);
 })
}
function downloadPhoto(i){
 const a=document.createElement("a"); a.href=get()[i]; a.download="Ramdev-Photography.jpg"; a.click();
}
function clearGallery(){if(confirm("Current demo gallery delete करें?")){localStorage.removeItem(KEY);render()}}
render();
</script>
</body>
</html>
