
 <!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramdev Photography</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#222
}
header{
  background:#111;
  color:#fff;
  padding:18px;
  text-align:center
}
main{
  max-width:900px;
  margin:auto;
  padding:15px
}
.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 2px 10px #0001
}
button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#111;
  color:white;
  margin:5px;
  cursor:pointer
}
input{
  margin:10px 0;
  width:100%
}
.small{
  font-size:13px;
  color:#666
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px
}
.photo{
  background:#eee;
  border-radius:10px;
  overflow:hidden
}
.photo img{
  width:100%;
  display:block
}
.status{
  padding:10px;
  background:#f0f0f0;
  border-radius:8px;
  margin-top:10px
}
</style>
</head>

<body>

<header>
  <h2>RAMDEV PHOTOGRAPHY</h2>
  <div>Wedding Photo Gallery</div>
</header>

<main>

<div class="card">
  <h3>📷 फोटो Add करें</h3>

  <input id="photoInput" type="file" accept="image/*" multiple>

  <button onclick="uploadPhotos()">फोटो Upload करें</button>

  <div id="uploadStatus" class="status">
    अभी कोई फोटो upload नहीं हुई।
  </div>

  <div class="small">
    फोटो upload होने से पहले RAMDEV PHOTOGRAPHY watermark लगाया जाएगा।
  </div>
</div>

<div class="card">
  <h3>Wedding Gallery</h3>

  <div id="status" class="small">
    Photos load हो रही हैं...
  </div>

  <div id="gallery" class="grid"></div>
</div>

</main>

<script>

const SUPABASE_URL =
"https://wxrwkvlcatryuopvwqjh.supabase.co";

const BUCKET =
"Wedding photo";

const SUPABASE_ANON_KEY =
"sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";


const statusBox =
document.getElementById("status");

const uploadStatus =
document.getElementById("uploadStatus");


function publicUrl(path){

  return SUPABASE_URL +
  "/storage/v1/object/public/" +
  encodeURIComponent(BUCKET) +
  "/" +
  path.split("/").map(encodeURIComponent).join("/");

}


/* WATERMARK */

async function makeWatermarked(file){

  let bitmap;

  try{
    bitmap = await createImageBitmap(
      file,
      {imageOrientation:"from-image"}
    );
  }catch(e){

    bitmap = await new Promise((resolve,reject)=>{

      const img = new Image();

      img.onload=()=>resolve(img);
      img.onerror=reject;

      img.src=URL.createObjectURL(file);

    });

  }


  const maxSize = 2000;

  let w = bitmap.width;
  let h = bitmap.height;

  if(w > maxSize){

    h = Math.round(h * maxSize / w);
    w = maxSize;

  }

  if(h > maxSize){

    w = Math.round(w * maxSize / h);
    h = maxSize;

  }


  const canvas =
  document.createElement("canvas");

  canvas.width=w;
  canvas.height=h;

  const ctx =
  canvas.getContext("2d");

  ctx.drawImage(bitmap,0,0,w,h);


  /* WATERMARK */

  ctx.save();

  ctx.globalAlpha=0.22;
  ctx.fillStyle="white";
  ctx.font="bold 28px Arial";

  ctx.translate(w/2,h/2);
  ctx.rotate(-30*Math.PI/180);

  const text="RAMDEV PHOTOGRAPHY";

  for(let y=-h*2;y<h*2;y+=90){

    for(let x=-w*2;x<w*2;x+=300){

      ctx.fillText(text,x,y);

    }

  }

  ctx.restore();


  return await new Promise(resolve=>{

    canvas.toBlob(
      blob=>resolve(blob),
      "image/jpeg",
      0.88
    );

  });

}


/* UPLOAD */

async function uploadPhotos(){

  const input =
  document.getElementById("photoInput");

  const files =
  Array.from(input.files || []);


  if(!files.length){

    uploadStatus.textContent =
    "पहले फोटो चुनें।";

    return;

  }


  uploadStatus.textContent =
  "Upload शुरू हो रहा है...";


  let success=0;


  for(let i=0;i<files.length;i++){

    const file=files[i];

    uploadStatus.textContent =
    "Photo " +
    (i+1) +
    " / " +
    files.length +
    " तैयार हो रही है...";


    try{

      const watermarked =
      await makeWatermarked(file);


      const base =
      file.name
      .replace(/\.[^/.]+$/,"")
      .replace(/[^\w\-]+/g,"_");


      const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).slice(2,8) +
      "-" +
      base +
      ".jpg";


      const uploadUrl =
      SUPABASE_URL +
      "/storage/v1/object/" +
      encodeURIComponent(BUCKET) +
      "/" +
      encodeURIComponent(fileName);


      const res =
      await fetch(uploadUrl,{

        method:"POST",

        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type":"image/jpeg",
          "x-upsert":"false"
        },

        body:watermarked

      });


      if(!res.ok){

        const errorText =
        await res.text();

        throw new Error(errorText);

      }


      success++;


      uploadStatus.textContent =
      "Photo " +
      (i+1) +
      " / " +
      files.length +
      " upload हो गई।";

    }

    catch(error){

      console.error(error);

      uploadStatus.textContent =
      "Photo upload नहीं हुई: " +
      file.name;

    }

  }


  uploadStatus.textContent =
  "✅ " +
  success +
  " फोटो successfully upload हो गई।";


  input.value="";

  loadGallery();

}


/* GALLERY */

async function loadGallery(){

  statusBox.textContent =
  "Photos load हो रही हैं...";


  try{

    const res =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/list/" +
      encodeURIComponent(BUCKET),
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          prefix:"",
          limit:1000,
          offset:0,
          sortBy:{
            column:"name",
            order:"asc"
          }
        })

      }
    );


    if(!res.ok)
      throw new Error(
        await res.text()
      );


    const files =
    await res.json();


    const photos =
    files.filter(x =>
      x.name &&
      /\.(jpg|jpeg|png|webp)$/i.test(x.name)
    );


    const gallery =
    document.getElementById("gallery");

    gallery.innerHTML="";


    photos.forEach(file=>{

      const url =
      publicUrl(file.name);


      const div =
      document.createElement("div");

      div.className="photo";


      div.innerHTML =
      `
      <img src="${url}" loading="lazy">

      <div style="padding:8px">

      <a href="${url}"
         download
         style="text-decoration:none">

        <button>Download</button>

      </a>

      </div>
      `;


      gallery.appendChild(div);

    });


    statusBox.textContent =
    photos.length +
    " फोटो Gallery में हैं।";

  }

  catch(error){

    console.error(error);


    statusBox.textContent =
    "Photos load नहीं हुईं।";

  }

}


loadGallery();

</script>

</body>
</html>
