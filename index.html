
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramdev Photography Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#181818;color:#fff}
header{background:#080808;text-align:center;padding:22px 10px}
header h2{margin:0;font-size:22px}
header p{margin:8px 0 0;color:#ccc;font-size:14px}
main{max-width:1000px;margin:auto;padding:15px}
#status{background:#292929;padding:12px;border-radius:9px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo{background:#292929;border-radius:10px;overflow:hidden}
.photo img{width:100%;display:block;object-fit:contain}
.photo a{display:block;text-align:center;padding:12px;background:#333;color:white;text-decoration:none;font-size:15px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h2>RAMDEV PHOTOGRAPHY</h2>
<p>Wedding Photo Gallery</p>
</header>
<main>
<div id="status">फोटो लोड हो रही हैं...</div>
<div id="gallery" class="grid"></div>
</main>
<script>
const SUPABASE_URL="https://wxrwkvlcatryuopvwqjh.supabase.co";
const BUCKET="Wedding photo";
const KEY="sb_publishable_LSDKQCTKq4pWbFTbNeEPIg_cdDCN7HM";
const statusBox=document.getElementById("status");
const gallery=document.getElementById("gallery");

async function loadGallery(){
  try{
    const response=await fetch(
      SUPABASE_URL+"/storage/v1/object/list/"+encodeURIComponent(BUCKET),
      {
        method:"POST",
        headers:{
          "apikey":KEY,
          "Authorization":"Bearer "+KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prefix:"",
          limit:1000,
          sortBy:{column:"created_at",order:"desc"}
        })
      }
    );
    if(!response.ok)throw new Error("HTTP "+response.status);
    const files=await response.json();
    const photos=files.filter(f=>f.name&&/\.(jpg|jpeg|png|webp)$/i.test(f.name));
    if(!photos.length){
      statusBox.textContent="अभी Gallery में कोई फोटो नहीं है।";
      return;
    }
    statusBox.textContent="कुल "+photos.length+" फोटो उपलब्ध हैं।";
    photos.forEach(file=>{
      const path=file.name.split("/").map(encodeURIComponent).join("/");
      const url=SUPABASE_URL+"/storage/v1/object/public/"+encodeURIComponent(BUCKET)+"/"+path;
      const filename=file.name.split("/").pop();
      const card=document.createElement("div");
      card.className="photo";
      const img=document.createElement("img");
      img.src=url;
      img.alt="Ramdev Photography wedding photo";
      img.loading="lazy";
      const link=document.createElement("a");
      link.href=url+"?download="+encodeURIComponent(filename);
      link.textContent="⬇ फोटो डाउनलोड करें";
      link.setAttribute("download",filename);
      link.setAttribute("target","_blank");
      link.setAttribute("rel","noopener");
      card.appendChild(img);
      card.appendChild(link);
      gallery.appendChild(card);
    });
  }catch(error){
    statusBox.textContent="फोटो लोड नहीं हुईं: "+error.message;
  }
}
loadGallery();
</script>
</body>
</html>
